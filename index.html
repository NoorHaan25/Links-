<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noorhan Taha</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FBF3EF; --glow:#F7D9CC; --surface:#FFFFFF; --ink:#2B1632; --muted:#7A6580; --line:#EBDAD6;
  --plum:#7B2D5B; --plum-ink:#FFFFFF; --peach:#F0997D; --icon-bg:#F6E6EE; --icon-ink:#7B2D5B;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1020; --glow:#3A1B3A; --surface:#271830; --ink:#F6EAF1; --muted:#B79FBE; --line:#3D2A47;
    --plum:#E58BC0; --plum-ink:#2B1632; --peach:#F0997D; --icon-bg:#3A2447; --icon-ink:#F0A9CF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1020; --glow:#3A1B3A; --surface:#271830; --ink:#F6EAF1; --muted:#B79FBE; --line:#3D2A47;
  --plum:#E58BC0; --plum-ink:#2B1632; --peach:#F0997D; --icon-bg:#3A2447; --icon-ink:#F0A9CF;
  color-scheme:dark;
}
html{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100%; color:var(--ink);
  font-family:"Cairo","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  background:var(--bg) radial-gradient(ellipse 80% 45% at 50% 0%, var(--glow), transparent 70%) no-repeat;
  display:flex; justify-content:center; padding:44px 20px 40px;
}
main{width:100%; max-width:440px}
header{text-align:center; margin-bottom:34px}
.avatar{
  width:96px; height:96px; margin:0 auto 18px; border-radius:50%;
  background:var(--plum); color:var(--plum-ink);
  display:flex; align-items:center; justify-content:center;
  font-size:2.1rem; font-weight:700; letter-spacing:.02em;
  box-shadow:0 0 0 5px var(--bg), 0 0 0 8px var(--peach);
}
h1{font-size:2.1rem; line-height:1.15; margin:0 0 8px; font-weight:700}
.sub{margin:0; color:var(--muted); font-size:1.02rem}
ul{list-style:none; margin:0; padding:0; display:grid; gap:12px}
a.link{
  display:flex; align-items:center; gap:14px; padding:14px 16px;
  background:var(--surface); color:var(--ink); text-decoration:none;
  border:1px solid var(--line); border-radius:18px;
  transition:transform .15s ease, border-color .15s ease;
}
a.link:hover{transform:translateY(-2px); border-color:var(--plum)}
a.link:focus-visible{outline:3px solid var(--peach); outline-offset:2px}
.ico{
  flex:none; width:46px; height:46px; border-radius:13px;
  background:var(--icon-bg); color:var(--icon-ink);
  display:flex; align-items:center; justify-content:center;
}
.ico svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.txt{flex:1; display:flex; flex-direction:column; min-width:0}
.t{font-weight:700; font-size:1.08rem}
.d{color:var(--muted); font-size:.88rem}
.go{flex:none; width:20px; height:20px; fill:none; stroke:var(--muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
a.primary{background:var(--plum); border-color:var(--plum); color:var(--plum-ink)}
a.primary .d{color:var(--plum-ink); opacity:.8}
a.primary .ico{background:rgba(255,255,255,.18); color:var(--plum-ink)}
a.primary .go{stroke:var(--plum-ink)}
@media (prefers-reduced-motion:reduce){a.link{transition:none} a.link:hover{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <div class="avatar" aria-hidden="true">NT</div>
    <h1>Noorhan Taha</h1>
  </header>
  <ul>
    <li><a class="link" href="https://drive.google.com/file/d/1jWKS28or8j6p9Fbjoe5NnT1kJMB8sUDJ/view?usp=sharing" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>
      <span class="txt"><span class="t">CV</span><span class="d">Open my resume</span></span>
      <svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a></li>
    <li><a class="link" href="https://portfolio-peach-nine-z9t5g5kkme.vercel.app/" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></span>
      <span class="txt"><span class="t">Portfolio</span><span class="d">See my projects</span></span>
      <svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a></li>
      <li><a class="link" href="https://www.linkedin.com/in/noorhan-taha/" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v6M8 7.5v.01M12 16v-6M12 12.5a2.5 2.5 0 0 1 5 0V16"/></svg></span>
      <span class="txt"><span class="t">LinkedIn</span><span class="d">Connect with me</span></span>
      <svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a></li>
    <li><a class="link" href="https://drive.google.com/file/d/1Ao40-t1tdlQbwvI7N9HF1yRh_pKzXr7w/view?usp=sharing" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
      <span class="txt"><span class="t">Infographic</span><span class="d">My profile at a glance</span></span>
      <svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a></li>
    
  </ul>
</main>
</body>
</html>
